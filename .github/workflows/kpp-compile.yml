name: build and run tests

on:
  push:
   branches: [ cicd ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
         boost_version: 1.84.0
         link: static
         platform_version: 2022
         toolset: mingw
         cache: false
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          arch: 'win64_mingw'
      - name: Running cmake
        run: |
          mkdir build
          cd build
          cmake -G "MinGW Makefiles" ..
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
      - name: Running make
        if: success() || failure()
        run: |
          cd build
          make
      - name: Run windeployqt
        run: |
          $qtPath = (Get-Command windeployqt).Path
          & $qtPath --release build/bin/gui/k-pp-gui.exe
      - name: Copy libwinpthread dll for cli
        run: copy build/bin/gui/libwinpthread-1.dll build/bin/cli/
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KPP-win-portable
          path: build/bin/